@keyframes scan{from{transform:translateY(70px);opacity:.8}to{transform:translateY(300px);opacity:0}}
@keyframes steam{50%{transform:translateY(-4px);opacity:.3}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
