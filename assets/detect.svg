<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 212" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="15" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{fill:#7d8590;white-space:pre}
.o{transform-box:fill-box;transform-origin:left}
#clip{animation:grow 1.5s steps(29,jump-start) .3s both}
.cur{opacity:0;animation:type 1.5s steps(29,jump-start) .3s both,cur 2.1s step-end both}
.prog{animation:fade 1ms 2.1s both}
.bar{animation:grow 1.6s steps(4,jump-end) 2.1s both}
.fr{opacity:0;animation:on .4s step-end none}
.last{animation:fade 1ms 3.7s both}
.term{animation:out .4s ease-in 4s both}
.name{animation:rise .7s cubic-bezier(.2,.7,.2,1) 4.5s both}
.b{fill:none;stroke-width:2.5;stroke-dasharray:1;animation:draw .5s ease-out both}
.f{animation:fade .3s both}
.t{fill:#0d1117;font-size:12.5px;font-weight:700}
@keyframes grow{from{transform:scaleX(0)}}
@keyframes type{to{transform:translateX(261px)}}
@keyframes cur{0%{opacity:1}86%{opacity:0}93%{opacity:1}100%{opacity:0}}
@keyframes on{from,to{opacity:1}}
@keyframes fade{from{opacity:0}}
@keyframes out{to{opacity:0}}
@keyframes rise{from{opacity:0;transform:translateY(8px)}}
@keyframes draw{from{stroke-dashoffset:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.term{display:none}}
</style>
<g class="term">
<clipPath id="c"><rect id="clip" class="o" x="40" y="10" width="262" height="28"/></clipPath>
<text x="40" y="30" textLength="261" clip-path="url(#c)">$ python detect.py --antareep</text>
<rect class="cur" x="40" y="17" width="9" height="17" fill="#7d8590"/>
<g class="prog">
<text x="40" y="58" textLength="90">inference:</text>
<rect x="184" y="47" width="300" height="13" fill="#7d8590" opacity=".2"/>
<rect class="o bar" x="184" y="47" width="300" height="13" fill="#7d8590"/>
<g class="fr" style="animation-delay:2.1s"><text x="175" y="58" text-anchor="end" textLength="18">0%</text><text x="496" y="58" textLength="198">0/640 [00:00&lt;?, ?it/s]</text></g>
<g class="fr" style="animation-delay:2.5s"><text x="175" y="58" text-anchor="end" textLength="27">25%</text><text x="496" y="58" textLength="288">160/640 [00:00&lt;00:01, 398.2it/s]</text></g>
<g class="fr" style="animation-delay:2.9s"><text x="175" y="58" text-anchor="end" textLength="27">50%</text><text x="496" y="58" textLength="288">320/640 [00:00&lt;00:00, 405.9it/s]</text></g>
<g class="fr" style="animation-delay:3.3s"><text x="175" y="58" text-anchor="end" textLength="27">75%</text><text x="496" y="58" textLength="288">480/640 [00:01&lt;00:00, 409.1it/s]</text></g>
<g class="last"><text x="175" y="58" text-anchor="end" textLength="36">100%</text><text x="496" y="58" textLength="288">640/640 [00:01&lt;00:00, 411.4it/s]</text></g>
</g>
</g>

<g transform="translate(0 -70)">
<text class="name" x="440" y="200" font-size="42" font-weight="700" text-anchor="middle" textLength="302">Antareep Dey</text>

<path class="b" pathLength="1" stroke="#FF3838" d="M240 125H640V245H240Z" style="animation-delay:5s"/>
<path class="b" pathLength="1" stroke="#FFB21D" d="M264 149H664V269H264Z" style="animation-delay:5.2s"/>
<path class="b" pathLength="1" stroke="#3DDB86" d="M270 100H670V220H270Z" style="animation-delay:5.4s"/>
<g class="f" style="animation-delay:5.4s"><rect x="240" y="105" width="125" height="20" fill="#FF3838"/><text class="t" x="246" y="119.5" textLength="113">researcher 0.82</text></g>
<g class="f" style="animation-delay:5.6s"><rect x="264" y="129" width="117" height="20" fill="#FFB21D"/><text class="t" x="270" y="143.5" textLength="105">developer 0.60</text></g>
<g class="f" style="animation-delay:5.8s"><rect x="270" y="80" width="132" height="20" fill="#3DDB86"/><text class="t" x="276" y="94.5" textLength="120">caffeinated 0.91</text></g>
</g>
</svg>
