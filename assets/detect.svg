<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,'Liberation Mono',monospace" font-size="14" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
<style>
text{fill:#7d8590;white-space:pre}
.b{fill:none;stroke-width:2.5;stroke-dasharray:1;animation:draw .5s ease-out both}
.f{animation:fade .35s both}
.t{fill:#0d1117;font-size:12.5px;font-weight:700}
.scan{opacity:0;animation:scan 1.4s ease-in-out .4s both}
.steam{animation:steam 3s ease-in-out infinite}
